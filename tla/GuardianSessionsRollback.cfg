\* Fence constants scaled down (Q 4, attempt 1): the rollback depends on
\* hour directories, not fence timing.
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    c = c
    Sessions = {a, b, c}
    First = a
    Off <- OffRollback
    Q = 4
    Budget = 1
    Attempt = 1
    Fresh = 1
    HourLen = 60
    LateDur = 0
    MaxTime = 7
    MaxSeq = 2
INVARIANT RecoveryExact
CHECK_DEADLOCK FALSE
